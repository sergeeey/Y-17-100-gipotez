[project]
name = "y17-bridge-lab"
version = "0.1.0"
description = "Y-17 Cross-Domain Bridge Lab — falsification-first research lab scaffold"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "numpy>=1.26", "requests>=2.31"]

[tool.ruff]
# WHY: 100 to match ~/.claude/rules/coding-style.md and the PostToolUse formatter hook;
# without this pin, `ruff format` (default 88) and the hook (100) ping-pong the same file.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# WHY: one-off research scripts of the 2026-10-03 and 2026-10-13 autonomous rounds. They were
# run and independently verified as they are (see skeptic_verdict.md in each folder); restyling
# them now would change what was verified. Scoped to these dated folders, not to experiments/**.
"experiments/20261003-*/**" = ["E", "F", "I", "UP", "RUF"]
"experiments/20261013-*/**" = ["E", "F", "I", "UP", "RUF"]
# WHY: memory-audit 2026-10-14 harness; proposed/*_patched.py are generated copies of the live
# global hooks (must stay byte-identical to what was tested), snapshots/ are frozen inputs.
"tooling-eval/memory-audit-2026-10-14/**" = ["E501", "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF015", "RUF059", "RUF100", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
