  - id: H-B2-1z
    type: hypothesis
    title: "Does the closed-form eigenvalue condition number kappa(lambda_1) (Trefethen-Embree, zero pseudospectrum-sampling cost) bound and explain H-B2-1y's own non-converging deep_k, giving the 'numerically reliable, convergent K(A)' the user asked for after H-B2-1y?"
