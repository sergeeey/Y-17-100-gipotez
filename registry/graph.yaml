  # ───────────────────────── bridges (added 2026-09-06, R6/Hypothesis Revival Targets → B7) ─────────────────────────
  - id: B7-KAUFFMAN-ATTRACTORS
    type: bridge
    title: "Kauffman's Cancer Attractor hypothesis (1971) ↔ Boolean gene-regulatory-network dynamics: differentiated/pathological cell states are genuine dynamical attractors of the underlying regulatory network, not separate ad-hoc states"
    status: verified_grounding      # updated 2026-09-06 after H-B7-1 (reproduction, CONFIRMED) + H-B7-2 (perturbation, differentiated result)
    evidence: CONFLICT              # do(Rb=0): CONFIRMED-WEAKENED (destabilizes quiescence, but via a NEW attractor, not the strict "pre-existing attractor" reading); do(p27=0): REJECTED (quiescence survives)
    mechanism: "A gene regulatory network's Boolean state-transition dynamics settle into a small number of attractors (fixed points or limit cycles); Kauffman proposed that both normal cell types AND pathological states (e.g. persistent proliferation) correspond to attractors of the SAME network, reachable via different initial conditions or perturbations, not requiring a structurally different model for the disease state"
    source: "02-related-projects-context/Hypothesis Revival Targets — 9 классических гипотез для реанимации (2026-05-10).md (R6); CDT Protocol scoring session, 2026-09-06"
    updated: 2026-09-06
    session_summary_2026-09-06: >
      3 experiments. H-B7-1 (reproduction): independent brute-force enumeration exactly reproduced
      a third-party (PyBoolNet) computation of the Fauré et al. 2006 network's 2 wild-type
      attractors -- CONFIRMED, but explicitly a tooling-validation step, not a test of the
      hypothesis itself. H-B7-2 (permanent perturbation): do(Rb=0) makes the growth-factor-absent
      (CycD=0) region converge to a NEW period-8 cycling attractor instead of quiescence --
      CONFIRMED-WEAKENED (a single-gene loss is sufficient to destabilize quiescence, but the
      accessible attractor is genuinely NEW, not one of the unperturbed network's own attractors
      made newly reachable). do(p27=0) alone: REJECTED, quiescence survives. H-B7-3 (transient
      perturbation, the STRICT operationalization of Kauffman's original claim): a Compute-First
      deduction from H-B7-1's own exhaustive result (the CycD=0 region has exactly ONE attractor
      under the true rules) PROVED, before any new simulation, that a transient (released) clamp
      of Rb/p27 cannot escape that single attractor -- confirmed empirically on 6 concrete cases
      (all_cases_returned_to_quiescence=true). This is a TASK_INFEASIBLE-style finding, not
      evidence against Kauffman's hypothesis: this specific 10-node model lacks the
      multi-attractor-per-branch structure the STRICT claim requires to be testable at all: it has
      only 2 attractors total, cleanly separated by the CycD input switch, with no internal
      multistability within either branch. Net position, `evidence: CONFLICT` unchanged: the
      PERMANENT-clamp operationalization (H-B7-2) gives a qualified positive result for Rb; the
      STRICT, more faithful operationalization (H-B7-3) is untestable in this model; a model with
      genuine multistability per branch (candidates: other pyboolnet repository models, e.g.
      `zhang_tlgl`, `remy_tumorigenesis`) would be needed for a real test of Kauffman's original
      claim. H-B7-4 (transient perturbation, structurally-capable model): installed `pyboolnet`
      itself (not just its bundled .bnet files) and verified BEFORE designing the experiment
      that `remy_tumorigenesis` (Remy et al. 2015, bladder cancer, 35 nodes) has 25 attractors
      across 16 input branches, 8 of them genuinely multistable, two showing DIFFERENT
      PHENOTYPES (Growth_arrest vs Proliferation) under IDENTICAL external signaling -- exactly
      the structure H-B7-3 showed the Fauré model lacked. Tested transient `do(RAS=1)` (1-30
      steps) from the Growth_arrest fixed point in one such branch: REJECTED for this specific
      perturbation -- all cases return to Growth_arrest, none reach Proliferation. Unlike H-B7-3,
      this IS a genuinely informative negative result (the structural precondition for success
      existed), consistent with multi-hit carcinogenesis theory (single oncogene activation
      alone is textbook-insufficient). Named next step: a combined do(RAS=1, TP53=0) two-hit
      perturbation. Net position, `evidence: CONFLICT` unchanged, now with a real (not merely
      structurally foreclosed) negative data point on the strict hypothesis. H-B7-5 (two-hit
      perturbation): tested combined permanent `do(RAS=1, TP53=0)` -- the biologically standard
      oncogene+tumor-suppressor cooperating pair named as H-B7-4's own next step -- from the same
      Growth_arrest fixed point. REJECTED again (returns to Growth_arrest), but this time the
      mechanism was traced directly: `p21CIP` stays active DESPITE `TP53=0` via a SECOND,
      TP53-independent route in its own rule (`Growth_inhibitors&!CyclinE1&!AKT`), which alone
      blocks `CyclinD1` regardless of `RAS=1`. All 8 multistable branches in this model share
      `Growth_inhibitors=1`, so this redundant checkpoint is structural to the model, not specific
      to the one branch tested. Named next step: a three-hit `do(RAS=1, TP53=0, p21CIP=0)` test,
      directly motivated by the identified mechanism rather than another arbitrary gene choice. Net
      position, `evidence: CONFLICT` unchanged.
      H-B7-6 (three-hit perturbation): tested `do(RAS=1, TP53=0, p21CIP=0)`. REJECTED again --
      reaches a bit-string-novel attractor, but the model's own explicit phenotype nodes confirm it
      is still `Growth_arrest=1, Proliferation=0` (corrected an ambiguity in the pre-registered kill
      criterion by resolving it against the model's own phenotype semantics, not raw bit-string
      novelty). Found the FULL mechanism: `Growth_arrest = p21CIP | RBL2 | RB1` is an EXPLICIT
      three-way redundant OR gate in the network's own source; `CyclinD1` is PROVABLY (algebra,
      then independently confirmed via pyboolnet on all 3 real attractors of this branch including
      the genuine Proliferation one) never active at any fixed point of this branch, because RAS's
      only other targets (E2F1_medium/E2F3_medium) require RBL2/RB1 already off -- a
      chicken-and-egg loop RAS cannot break via permanent clamps alone. This explains, at the
      mechanism level, why H-B7-4/H-B7-5/H-B7-6 all failed: the real escape route runs through
      CyclinE1/CyclinA directly, never through RAS->CyclinD1. Named next step: four-hit
      do(RAS=1, TP53=0, p21CIP=0, RBL2=0), or a transient (not permanent) kick of RBL2/CyclinE1.
      Net position, `evidence: CONFLICT` unchanged.
      H-B7-7 (four-hit perturbation): tested `do(RAS=1, TP53=0, p21CIP=0, RBL2=0)`. **CONFIRMED**
      -- the FIRST successful permanent-clamp escape from Growth_arrest to Proliferation in this
      bridge. Reached state is byte-identical to the pyboolnet-verified PROLIFERATION_STATE;
      independently re-confirmed via a FRESH `pyboolnet.compute_attractors()` run on a
      branch-restricted, four-clamped .bnet (zero reuse of this project's own simulation code) --
      exactly 1 attractor, is_steady/is_univocal/is_faithful all yes, byte-identical match. Skeptic
      pass (FL Step 8a, context-asymmetric) verdict CONFIRMED-REAL, ran 5 falsification checks, all
      passed. One WEAKENING observation incorporated: RAS=1 and TP53=0 are already true at the
      Growth_arrest starting state (no-ops relative to that state), so the actual novel/sufficient
      perturbation is the two-hit do(p21CIP=0, RBL2=0) -- named as the next necessity-test step.
      This closes the mechanistic chain H-B7-4(REJECT)->H-B7-5(REJECT)->H-B7-6(REJECT,
      mechanism found)->H-B7-7(CONFIRMED), each REJECT motivating the next hit with increasing
      precision. Bridge evidence updated: CONFLICT retained (H-B7-2's do(Rb=0) qualifier and the
      untested-necessity gap both remain), but now with a clean CONFIRMED anchor, not only REJECTs.
      H-B7-8 (necessity test): tested do(p21CIP=0, RBL2=0) WITHOUT clamping RAS/TP53 -- directly
      operationalizing H-B7-7's own skeptic WEAKENING finding. CONFIRMED -- reaches the exact
      Proliferation attractor; unclamped RAS/TP53 dynamically settle to the same values H-B7-7
      clamped them to. Independently re-confirmed via a FRESH pyboolnet.compute_attractors() run
      (RAS/TP53 rules left completely intact, only p21CIP/RBL2 forced) -- exactly 1 attractor,
      byte-identical match. Skeptic pass (Step 8a) verdict CONFIRMED-REAL, with a documented
      caveat: the branch's own fixed inputs set up self-reinforcing signaling loops
      (FGFR3_stimulus->FGFR3->RAS->SPRY-|GRB2; DNA_damage=0 keeping TP53's first disjunct off)
      that make RAS=1/TP53=0 the branch's natural resting values -- softening but not eliminating
      the finding's novelty (neither node's rule is a syntactic tautology of the branch inputs
      alone, independently confirmed). Minimal sufficient perturbation for this starting point is
      now established: the two-hit do(p21CIP=0, RBL2=0). Next named step: transient (not
      permanent) version of this same double clamp -- untested for any confirmed escape in this
      bridge so far.
      H-B7-9 (transient necessity test): tested transient do(p21CIP=0, RBL2=0) for k=1,3,10,30
      steps then RELEASED to fully unperturbed wild-type dynamics. **CONFIRMED for k=10,30** --
      the FIRST confirmation of Kauffman's STRICT original hypothesis anywhere in this bridge (a
      pathological state pre-existing as a real attractor of the UNPERTURBED network, revealed by
      a TEMPORARY push, persisting after release). Clean duration threshold found: k=1,3 relapse
      to a DIFFERENT (second) Growth_arrest fixed point, not the original starting state; k=10,30
      reach the exact Proliferation attractor. Independently re-confirmed via a FRESH
      pyboolnet.compute_attractors() run on the FULLY UNCLAMPED branch (zero forcing at all,
      only branch inputs frozen) -- found EXACTLY 3 attractors, matching all three states this
      experiment reported (original Growth_arrest, second Growth_arrest, Proliferation)
      one-to-one, independently reproducing H-B7-4's original branch-scoping result. Skeptic pass
      (Step 8a) verdict CONFIRMED-REAL; skeptic also predicted (without being able to run it) that
      k=0 would show a period-2 oscillation rather than either named fixed point -- run and
      confirmed exactly. This closes the original methodological distinction named in H-B7-2's own
      decision.md between the weak (new attractor from permanent clamp) and strict (pre-existing
      attractor revealed by temporary push) readings of Kauffman's hypothesis -- the strict reading
      is now CONFIRMED for this branch and clamp pair. Net position: `evidence: CONFLICT` retained
      (H-B7-3's TASK_INFEASIBLE finding on the OTHER model and the untested-generality gap to other
      branches both remain), but the bridge now has its cleanest, most complete positive result.
      H-B7-10 (fine duration sweep k=4..9): pinned the exact threshold H-B7-9 left open (k=3
      relapse, k=10 escape). CONFIRMED -- clean monotone threshold at k*=5: k=4 relapses to the
      second Growth_arrest fixed point, k=5..9 all reach the exact Proliferation attractor.
      Full per-step trace (run during the FL Step 8a skeptic pass) reveals the EXACT mechanism:
      a one-synchronous-step race condition between the clamp's release and CyclinE1's
      self-sustaining activation -- at k=4, CyclinE1 turns True in the SAME step p21CIP/RBL2
      revert to True upon release (their rule evaluates the pre-release state where
      CyclinE1 was still False), blocking the loop; at k=5, CyclinE1 turns True one step BEFORE
      release, so p21CIP/RBL2's release-step evaluation already sees CyclinE1=True and stays off.
      Not just a measured threshold but a fully traced, step-by-step explained one. Skeptic pass
      (Step 8a) verdict CONFIRMED-REAL, hand-verified both boundary states against all 35 .bnet
      rules and adversarially tested the monotonicity-detection logic against 5 non-monotone
      shapes, all correctly rejected. Reused H-B7-9's simulate_transient_clamp_multi UNCHANGED
      (Minimal Relaxation Rule: only duration granularity changed).
      H-B7-11 (cross-branch generalization test): Compute-First re-enumeration of all 16 input
      branches (before designing this experiment) found exactly ONE other branch besides the one
      used throughout H-B7-4..10 with genuine phenotype divergence -- also caught and corrected a
      minor factual error in H-B7-4's original count (7, not 8, of 16 branches are multistable;
      documented as a dated correction addendum in H-B7-4's Data_README.md, not a silent rewrite;
      the "2 phenotype-divergent branches" claim was already correct). Tested the same permanent
      do(p21CIP=0, RBL2=0) clamp on this SECOND branch (differs by exactly one input bit,
      EGFR_stimulus 0->1). CONFIRMED -- reaches the exact Proliferation attractor for this branch,
      byte-identical to independently pyboolnet-verified PROLIFERATION_STATE_2; same escape-route
      nodes (CyclinE1, CyclinA, CDC25A, E2F1_medium, E2F3_medium, p16INK4a) active as in branch 1,
      confirming a structurally identical mechanism, not a coincidental byte match. First confirmed
      cross-branch generalization in this bridge. Skeptic pass (Step 8a) verdict CONFIRMED-REAL,
      including exhaustive attractor enumeration on the second branch (exactly 3, matching all
      claimed states) -- the one check the skeptic could not close by hand, then executed.
      CORRECTION (H-B7-12 scoping): the two branches tested (H-B7-4's original and H-B7-11's
      second) turned out to be dynamically EQUIVALENT -- EGFR's rule requires !FGFR3 in both
      disjuncts, and FGFR3_stimulus=1 is fixed identically in both, so EGFR_stimulus (the one
      differing input) never propagates to anything. H-B7-11's technical CONFIRMED result stands,
      but the "cross-branch generalization" framing is corrected: this network offers no branch
      with a Proliferation attractor that differs in a dynamically-live input, so the
      generalization question is EXHAUSTED for this escape target, not merely answered once.
      H-B7-12 (transient version on the second branch): tested the SAME transient do(p21CIP=0,
      RBL2=0) sweep (k=1,3,4,5,6,9,10,30) on H-B7-11's branch. CONFIRMED-GENERALIZES-SAME-
      THRESHOLD (kill criterion met literally) but WEAKENED in interpretation per the correction
      above: k*=5 reproduces EXACTLY, same one-step CyclinE1 race mechanism H-B7-10 traced --
      robustness to one inert input difference, not evidence of generalization across a
      genuinely different dynamical regime. Skeptic pass (Step 8a) flagged the "suspiciously
      convenient" exact match as reason for MORE scrutiny and found the EGFR/FGFR3 gating
      directly from the .bnet source. Verdict CONFIRMED-REAL with the WEAKENED caveat accepted,
      not dismissed.

