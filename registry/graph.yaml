    status: solved                   # RETROSCANNED 2026-09-10 (ADR-091): Colbrook, Stepaniants, Townsend, "A Complete Resolution of Forsythe's Conjecture for Restarted Conjugate Gradients", arXiv:2609.04659 (4 Sep 2026, verified real via mcp__arxiv__download_paper + the authors' own GitHub github.com/sgstepaniants/Forsythe, Lean-formalized proof). Sharp classification: TRUE for s in {1,2,3} (Akaike 1959 for s=1; this paper for s=2,3), FALSE for every s>=4 (explicit diagonal SPD counterexample, dimension s+4, constructed via a certified transverse-Hopf-bifurcation shadowing argument -- NOT a simple closed-form matrix, requires rational arithmetic with numerators up to ~2^500000). The catalog's "open" status and this project's own H-CAT37-1 experiment (2026-09-09) both predate this resolution by ~5 days.
