  - id: H-B3-1
    type: hypothesis
    title: "Phase 1 (Peter Lake): TDA signals (Betti-1, persistent entropy) lead classical EWS (variance, autocorrelation) on the Carpenter 2011 Peter Lake whole-ecosystem regime-shift experiment"
    status: lead                 # 2026-09-06: unblocked by a user-provided CSV (squealSondesMet_08to11_forOPUS.csv), run to completion -> CRITERION_INVALID (Step 4a, max floor false-positive rate 85%), NOT evidence against the claim. Independently reproduces the SAME floor-invalidity found in H-B3-1b on a completely different dataset. decision.md. CLAUDE.md 3-outcome convention -> LEAD, weak_alive.
    evidence: VERIFIED-REAL       # metrics/run.json; floor measured, not assumed; data internally consistency-checked (manifest.md)
    l0_type: predictive
    fl_tier: full
    kill_criterion: "On Peter Lake (manipulated), TDA signal (Betti-1/persistence entropy) does NOT precede classical EWS on ANY of 3 tested series (chl, pH, doSat) by a pre-registered lead time, with Paul Lake (reference) showing neither signal -> KILLED. RESULT: only doSat crossed for TDA (+1 day trivial lead over classical); chl/pH never crossed for TDA at all; Paul (negative control) false-positived on all 3 variables. AR(1) floor check: 45-85% false-positive rate with NO mechanism -> CRITERION_INVALID, not REJECT (FL Step 4a hard rule). Escape Point: first draft mis-applied the sibling experiment's ICE rule and silently analyzed only the 2009 season (114/450 days), missing the 2010 transition entirely -- caught before writing decision.md, fixed via season-time concatenation (2008-2010), locked in by tests/test_peterlake_tda_ews.py"
    experiment_dir: "experiments/20260906-may1972-tda-ews-peterlake"
    source: "01-cross-domain-bridges/Cross-Domain Bridge Lab — Project.md § Bridge 3 (corrected 2026-09-06); experiments/20260906-may1972-tda-ews-peterlake/decision.md"
    updated: 2026-09-06

  - id: H-B3-1b
    type: hypothesis
    title: "Phase 1 (O'Brien lakes): TDA (Betti-1 persistence entropy) leads classical EWS on Lower Zurich's ~2002 transition, silent on Windermere/Loch Leven (no transition)"
    status: lead                 # 2026-09-06 decision.md: CRITERION_INVALID (Step 4a) -- the tau>=0.5 detection rule sits AT floor (80-83% false-positive rate on a mechanism-free AR(1) null), NOT evidence against TDA or the bridge (hard rule). Core mechanism (TDA lead +24mo, correct sign, on the one real transition) survived -- Rescue Review verdict weak_alive. CLAUDE.md's 3-outcome convention (KILLED/CONFIRMED/LEAD) maps this to LEAD: promising, inconclusive, concrete non-circular follow-up ready (surrogate-null detection rule, new experiment ID required per Minimal Relaxation Rule).
    evidence: VERIFIED-REAL       # metrics/run.json; floor computed, not assumed
    l0_type: predictive
    fl_tier: full
    kill_criterion: "tau>=0.5 (expanding-window Kendall tau of rolling AC1/variance/H1-persistence-entropy, window=50% of series) crossed on Lower Zurich (positive, transition ~2002) with lead>0 for TDA, AND neither Windermere nor Loch Leven (both no-transition) cross on ANY statistic -> PASS. RESULT: Lower Zurich lead=+24mo (correct sign) but BOTH negative controls false-positived; floor check (30 AR(1) surrogates/lake) showed 80-83% false-positive rate under NO mechanism at all -> CRITERION_INVALID, not REJECT. Relaxation Map in decision.md: 3 non-circular fixes (surrogate-based null, change-point co-requirement, or report peak-tau instead of first-crossing), none yet run"
    experiment_dir: "experiments/20260906-may1972-tda-ews-obrienlakes"
    source: "experiments/20260906-may1972-tda-ews-obrienlakes/decision.md"
    updated: 2026-09-06

  - id: H-B3-1c
    type: hypothesis
    title: "V1: per-series per-timepoint AR(1)-surrogate-null (alpha=0.05) replaces the fixed tau>=0.5 threshold, re-run on all 9 series from both H-B3-1 and H-B3-1b"
    status: killed                # 2026-09-06 decision.md: genuine REJECT (not CRITERION_INVALID -- the rule itself validated as sound by a self-consistency unit test; AR(1) specifically is too simple a null model for these real series). null_results/H-B3-1c-lakes-tda-ews-surrogate-null-v1.md
    evidence: VERIFIED-REAL       # metrics/run.json; self-consistency of the rule independently verified by tests/test_surrogate_null_v1.py
    l0_type: predictive
    fl_tier: full
    kill_criterion: "False-positive rate on the 4 negative-control series (Windermere, Loch Leven, Paul pH/doSat/chl -- 5 series total incl. all 3 Paul variables) must be < 4/5 (better than the fixed-threshold rule) AND >=1 positive case (Lower Zurich, Peter x3) must show a TDA lead>0, for PASS. RESULT: 5/5 negative controls false-positived (identical outcome in kind to the fixed threshold, different mechanism); only Peter doSat showed a directional TDA lead (+13 days), uninterpretable given the false positives -> REJECT. Relaxation Map: V1' (IAAFT phase-randomized surrogate, richer null capturing full power spectrum not just lag-1 autocorrelation) is the least-circular next candidate, not yet run -- new experiment ID required (Minimal Relaxation Rule)"
    experiment_dir: "experiments/20260906-lakes-tda-ews-surrogate-null-v1"
    source: "experiments/20260906-lakes-tda-ews-surrogate-null-v1/decision.md"
    updated: 2026-09-06

