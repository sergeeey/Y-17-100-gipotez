  - id: H-B2-1u
    type: hypothesis
    title: "Direct verification of the Kreiss Matrix Theorem inequality K(A) <= sup_t||exp(tA)|| <= e*n*K(A) on this arc's own matrices (user's own Priority 3, mechanistic analysis)"
    status: lead                 # 2026-09-08 decision.md: MECHANISM_VERIFIED, 20/20 matrices (10 seeds x N_DIM in {40,50}) satisfy the proven upper bound after a self-caught bug/fix. First draft's EPS_VALUES=(0.5..3.0) with the arc-wide grid produced 1/20 apparent violations (seed=301, N=50: growth=11025.75 > ceiling=3104.06) -- investigated per Causal Debugging Protocol rather than reported as-is: this matrix family (diagonal + strictly-upper-triangular random coupling, near-nilpotent) has its true Kreiss-constant supremum in the SMALL-eps regime (eps=0.02 gave ratio=259.78 vs 22.84 at eps=0.5-3.0, an 11x jump), which the first-draft EPS_VALUES never sampled -- a sampling gap in this experiment's OWN new code, not a bug in the twice-independently-verified pseudospectral_abscissa (H-B2-1r/H-B2-1s) and not evidence against the theorem. Fixed by widening EPS_VALUES to (0.02,0.05,0.1,0.2,0.5,1.0,2.0) with a dedicated local grid centered on alpha(A). Re-run: 0/20 violations. CORRECTION (mandatory reviewer P1, verified 2026-09-08): k_estimate is a DEMONSTRATED LOWER BOUND, not converged -- ratio was still climbing steeply at eps down to 0.001 on the worst-case matrix (262.9->2208.5 across 5 octaves), no plateau found; a structural limit of grid-search (needs grid step << eps, unbounded resolution as eps->0), not fixable by more EPS_VALUES. Consequence: MECHANISM_VERIFIED is UNAFFECTED (underestimated K only tightens the check), but the reported efficiency ratios (median 3.7-6.3%, max 31%) are UPPER bounds on the true (even lower/looser) efficiency, and the N=50 "31% outlier" is very likely an artifact of uneven undershoot across matrices, not a real per-matrix difference (at eps=0.001 that same matrix's efficiency drops to ~3.7%, in line with the other 19). Status LEAD (not "confirmed"): a proven theorem cannot be confirmed by data, only have its computation verified -- the substantive, genuinely new content is the qualitative "bound holds but is loose" finding (strengthened, not weakened, by the convergence caveat), contextualizing (not undermining) H-B2-1r/1s/1t's correlational results.
    evidence: VERIFIED-REAL       # metrics/run.json (20 matrices, per-seed K_estimate/growth/ceiling/efficiency); 9 tests incl. a regression test locking in the exact bug/fix matrix (seed=301, N=50); diagnostic scripts kept at tooling-eval/diagnostics/ (initial bug scan + convergence-check follow-up); mandatory reviewer found and this session verified a real P1 (unconverged eps floor) before merge
    l0_type: descriptive
    fl_tier: standard
    kill_criterion: "The proven upper bound raw_transient_growth(A) <= e*n*K_estimate(A) must hold for every sampled matrix (violation would indicate a real code bug, not a normal REJECT -- theorem cannot be falsified by correct data). RESULT after bug/fix: 0/20 violations -> MECHANISM_VERIFIED. Lower bound (diagnostic only, not part of kill criterion per the honest T_MAX caveat) also held for all 20. Full bug/fix history and efficiency table in decision.md."
