    evidence: VERIFIED-REAL       # metrics/run.json (mechanism-gate fine-eps sweep on a small matrix, 16-matrix kappa-vs-deep_k comparison, full 80+30-matrix refit with both single- and two-feature models); 8 tests incl. a symmetric-matrix positive control (kappa=1 for a normal matrix) and a feature-shape check tying the RMSE comparison to H-B2-1x's actual model -- NOTE: none of these tests would have caught the kappa-vs-true-K(A) gap, since none compared kappa(lambda_1) against an independent resolvent-norm lower bound; this is itself a gap in this experiment's own controls, not just its interpretation
