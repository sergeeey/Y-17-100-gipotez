  - id: H-B2-1y
    type: hypothesis
    title: "Is H-B2-1w/1x's super-linear M1~K(A)^2.2-2.5 exponent a genuine property of this matrix family, or an artifact of the shallow K(A) estimate's own systematic, K-magnitude-dependent underestimation bias? (user's own choice after a bounded literature search for Option B found no matching theorem)"
    status: confirmed            # 2026-09-08 decision.md: ARTIFACT_HYPOTHESIS_SUPPORTED, a real, substantial, quantified effect. On 16 matrices stratified across H-B2-1x's own K(A) range (30.2-221.5), a DEEP K(A) re-measurement (pseudopy.NonnormalAuto, eps down to 5e-6, an order of magnitude deeper than H-B2-1v's own check) found: bias_factor (deep_K/shallow_K) grows as approximately shallow_K^1.6 (slope=1.62, R^2=0.63) -- NOT uniform across the population. Bias ranged from 1.57x (smallest-K matrix, nearly converged already) to 84.3x (largest-K matrix, seed=329,N=50: shallow_K=221.5 vs deep_K=18,669). Refitting M1~K(A) on the SAME 16-matrix subset: shallow-K exponent 2.193 (consistent with H-B2-1w/1x) -> deep-K exponent 0.722 -- moved substantially toward (and past) the classical linear relationship, not just "toward" it. CONCLUSION: the apparent K-squared law from H-B2-1w/1x looks like it was substantially a measurement artifact, not new physics -- resolves the "Option B" literature-search dead-end from earlier this session without needing a new theorem. HONEST CAVEATS (all disclosed, not glossed): small sample (16 pts) with 2 high-leverage extreme points; "deep" K(A) is itself still not fully converged -- VERIFIED directly (not assumed): all 16/16 matrices hit their max ratio at the SMALLEST tested eps (0.00001), still climbing steeply with no inflection, same "100% boundary hits" pattern H-B2-1u found for the shallow estimate -- so the 0.72 exponent and the 1.6x-84x bias factors are themselves conservative (true correction likely larger); the exponent moved BELOW 1, not just to 1, which is itself an open, unexplained observation, not resolved here. Mandatory reviewer found 2 real gaps (fixed same session, not amended): a `next(...)` lookup with no uniqueness guard on (n_dim,seed), and a monotonicity test that could pass vacuously if every deep_k came back None -- both closed with explicit assertions.
    evidence: VERIFIED-REAL       # metrics/run.json (16 matrices, shallow vs deep K(A), bias factors, matched-subset exponent comparison); 6 tests incl. a positive-control tricontour-extraction test (same method as H-B2-1v), a monotonicity check (deep_K >= shallow_K for every matrix, now requiring non-None coverage on ALL 16, not vacuous), and a train-data uniqueness check
