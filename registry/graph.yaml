      self-sustaining activation -- at k=4, CyclinE1 turns True in the SAME step p21CIP/RBL2
      revert to True upon release (their rule evaluates the pre-release state where
      CyclinE1 was still False), blocking the loop; at k=5, CyclinE1 turns True one step BEFORE
      release, so p21CIP/RBL2's release-step evaluation already sees CyclinE1=True and stays off.
