  - id: B3-MAY-TDA
    type: bridge
    title: "May 1972 stability–complexity ↔ TDA early-warning signals"
    status: verified_grounding
    evidence: CONFLICT      # updated 2026-09-06 after 10 experiments (H-B3-1 through H-B3-1i) -- was stale at initial-scoping HYPOTHESIS since before any of them ran
    mechanism: "Persistent homology (Betti-1, persistent entropy OR total persistence) of network snapshots detects phase-space restructuring before variance/autocorrelation drift"
    source: "01-cross-domain-bridges/Cross-Domain Bridge Lab — Project.md § Bridge 3"
    updated: 2026-09-06
    session_summary_2026-09-06: >
      10 experiments (H-B3-1 through H-B3-1i), same 9-series population throughout. Fixed
      tau>=0.5 threshold: CRITERION_INVALID (floor 45-90% on 2 independent real datasets,
      H-B3-1/1b). Per-series self-calibrated null (V1): REJECT, 5/5 false positives on
      entropy, byte-identical across 3 structurally different null models (AR1/IAAFT/
      detrend+IAAFT, H-B3-1c/d/e) -- rules out null-model choice as the cause. Switching
      the TDA invariant (entropy -> total persistence, H-B3-1g) DID change the profile
      (4/5, different series) -- the invariant axis matters, the null-model axis does not,
      for entropy. Conjunction of both invariants (H-B3-1h, no new compute): best
      specificity in the arc, 2/5. Filling the last null-model x invariant cell (IAAFT +
      total persistence, H-B3-1i, real new compute): REJECT again (4/5, same series as
      V1g) -- but Peter doSat's TDA-leads-classical lead, identical (+13d) across 4 prior
      structurally different variants and repeatedly the single most confident finding of
      the whole arc, REVERSES SIGN to -74d here. Mechanism isolated cheaply (single-series
      diagnostic): the null THRESHOLD curve is spikier under IAAFT, with a specific spike
      blocking the AR(1)-era crossing point. Net position: the mechanism as originally
      hypothesized (TDA detects real regime shifts before classical EWS) is NOT
      established as general or robust -- it produces false positives at a rate far above
      PROMOTE bar under every method tried, and its one interpretable positive-lead
      signal is itself not stable across all null models tested. Two negative-role series
      (Loch Leven, Paul doSat) resist every method tried (6+ variants) -- the single most
      concentrated, unexplained finding in the bridge, still open. `evidence: CONFLICTING`
      reflects this mix (real, reproducible signal under SOME conditions; real, reproducible
      failure under others) rather than either PROMOTE or a clean REJECT of the whole bridge.
    session_summary_2026-09-07: >
      CORRECTION (Hindsight Distortion Gap, not a silent rewrite of the block above): the claim
      "two negative-role series (Loch Leven, Paul doSat) resist every method tried" is factually
      WRONG, not merely imprecise. Built a full cross-tabulation of tda_betti_crossing across all
      7 method variants actually run (V1, V1', V2', V1g, V1g', diagram-distance+AR1,
      diagram-distance+IAAFT) x all 9 series, read directly from each experiment's committed
      metrics/run.json. Windermere crosses 6/7 -- the SAME rate as 3 of the 4 positive-role
      series. Crossing rate does NOT correlate with positive/negative role at all. The actual
      outliers are Paul_doSat (7/7, the ONLY series crossing under literally every method) and
      Paul_chl/Paul_pH (3/7 each, tied for the lowest rate of all 9 series) -- Loch Leven itself
      sits at an unremarkable 6/7. Two candidate mechanisms tested against this corrected,
      sharper question (Paul lake's 3 variables: same lake, same period, cleanest available
      natural comparison): (1) raw monotonic trend strength -- REJECTED, inverted (pH has by far
      the strongest trend, Spearman rho=-0.579 p~3e-31, yet the LOWEST crossing rate 3/7; doSat
      has no significant trend, rho=-0.044 p=0.42, yet the HIGHEST rate 7/7); (2) lag-1
      autocorrelation -- WEAK, not statistically confirmed (direction matches prediction on both
      the full 9-series population, rho=-0.523 p=0.149, and a sampling-frequency-controlled
      6-series peterlake-only subset, rho=-0.441 p=0.381, but neither reaches significance at
      this sample size). Full writeup: experiments/20260906-lakes-tda-ews-invariant-conjunction/
      decision.md Addenda 3-4. Net position unchanged: evidence CONFLICT/CONFLICTING stands, but
      the "sharpest open question" is now correctly stated as Paul_doSat vs Paul_chl/Paul_pH, not
      Loch Leven/Paul doSat vs 3 others. Addendum 5 (same day): replicated the within-lake
      comparison on Peter lake (positive-role) as an out-of-sample check. Peter's own
      crossing-rate spread (chl=6/7, pH=4/7, doSat=6/7) is qualitatively different in SHAPE from
      Paul's (3/7, 3/7, 7/7 -- doSat alone at top vs. doSat/chl tied at top on Peter) -- yet the
      SPECIFIC direction "strongest trend -> lowest crossing rate" replicated independently: pH
      has both the strongest trend (rho=-0.721, strongest of all 6 variables across both lakes)
      and the lowest crossing rate (4/7) on Peter too. 2-for-2 informal replication of this
      narrow claim, though the formal pooled test (n=6, same series already tested) remains
      non-significant (rho=-0.441, p=0.381 for both |trend| and AC1 against crossing rate --
      found to be numerically identical, a genuine coincidence given rank ties at this n, not a
      bug). Side finding: |trend| and AC1 are themselves rank-correlated in this dataset --
      plausibly two facets of one non-stationarity axis, not independent candidates.

